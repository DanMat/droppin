<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Pin not found — droppin</title>
		<style>
			:root { color-scheme: dark; }
			* { margin: 0; box-sizing: border-box; }
			body {
				min-height: 100vh; display: grid; place-items: center; text-align: center;
				background: radial-gradient(900px 500px at 50% 20%, #16233a 0%, #0c1016 60%);
				color: #e9eef4; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				padding: 2rem;
			}
			.mark { height: 96px; width: auto; margin-bottom: 1.5rem; animation: drop 0.7s cubic-bezier(0.34,1.56,0.64,1); }
			@keyframes drop { 0% { transform: translateY(-40px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
			@media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
			h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 720; letter-spacing: -0.02em; margin-bottom: 0.6rem; }
			p { color: #9aa7b6; font-size: 1.05rem; max-width: 46ch; margin: 0 auto 1.8rem; line-height: 1.5; }
			a.btn {
				display: inline-block; text-decoration: none; font-weight: 600; color: #fff;
				background: #1f6feb; border-radius: 10px; padding: 0.7rem 1.3rem;
			}
			a.btn:hover { background: #0b53c7; }
			.code { font-family: ui-monospace, Menlo, Consolas, monospace; color: #57a0ff; letter-spacing: 0.1em; font-size: 0.8rem; margin-top: 2rem; }
		</style>
	</head>
	<body>
		<main>
			<svg class="mark" viewBox="0 0 96 128" xmlns="http://www.w3.org/2000/svg" aria-label="Droppin">
				<defs>
					<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cc0ff"/><stop offset="1" stop-color="#2f6fe0"/></linearGradient>
					<mask id="h"><rect width="96" height="128" fill="#fff"/><circle cx="48" cy="43" r="14" fill="#000"/></mask>
				</defs>
				<ellipse cx="48" cy="120" rx="15" ry="4" fill="#57a0ff" opacity="0.25"/>
				<path d="M48 6 C26 6 10 23 10 44 C10 72 48 104 48 104 C48 104 86 72 86 44 C86 23 70 6 48 6 Z" fill="url(#g)" mask="url(#h)"/>
			</svg>
			<h1>This pin didn’t drop 📍</h1>
			<p>That location isn’t on the map — the page you’re looking for doesn’t exist. Let’s get you back to solid ground.</p>
			<a class="btn" href="/">← Back to droppin</a>
			<div class="code">ERROR 404 · NO SUCH WAYPOINT</div>
		</main>
	</body>
</html>
