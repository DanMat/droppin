# Droppin: a static client-side app served by a thin Worker that adds a few
# vanity redirects (/gh, /example) + canonical www→apex. `pnpm deploy` builds
# then `wrangler deploy`.
name = "droppin"
main = "src/worker.ts"
compatibility_date = "2025-08-01"
workers_dev = true # keep droppin.danmat.workers.dev alive as a fallback

# Custom domain (registered in this Cloudflare account). Top-level, NOT under
# [assets] — Cloudflare provisions the routing + TLS cert on deploy.
routes = [
  { pattern = "droppinmap.com", custom_domain = true },
  { pattern = "www.droppinmap.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS" # so the Worker can serve static files
not_found_handling = "404-page" # /404.html for unknown paths (via env.ASSETS.fetch)
