# Droppin is a fully static, client-side app — deployed as an assets-only
# Cloudflare Worker (no server code). `pnpm deploy` builds then `wrangler deploy`.
name = "droppin"
compatibility_date = "2025-08-01"
workers_dev = true # keep droppin.danmat.workers.dev alive as a fallback

# Custom domain (registered in this Cloudflare account). Top-level, NOT under
# [assets] — Cloudflare provisions the routing + TLS cert on deploy.
routes = [
  { pattern = "droppinmap.com", custom_domain = true },
  { pattern = "www.droppinmap.com", custom_domain = true },
]

[assets]
directory = "./dist"
not_found_handling = "404-page" # serves /404.html for unknown paths
